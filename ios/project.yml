name: FrameShift
options:
  bundleIdPrefix: com.wongjemoment
  deploymentTarget:
    iOS: "17.0"
targets:
  FrameShift:
    type: application
    platform: iOS
    sources:
      - path: FrameShift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wongjemoment.frameshift
        PRODUCT_NAME: FrameShift
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FRAME/SHIFT
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
